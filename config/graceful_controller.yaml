/blueboat/controller_server:
  ros__parameters:

    use_sim_time: false

    # Frecuencia del controlador
    controller_frequency: 10.0

    # Odometría del BlueBoat
    odom_topic: /blueboat/odometry/filtered_enu

    # Plugins
    controller_plugins: ["FollowPath"]
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]

    # Comprobar que el barco avanza
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 60.0

    # Comprobar llegada al destino
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 0.8
      stateful: true

    FollowPath:
      plugin: "nav2_graceful_controller::GracefulController"
      motion_target_dist: 1.2
      v_linear_min: 0.05
      v_linear_max: 0.18
      v_angular_max: 0.8
      initial_rotation: true
      initial_rotation_min_angle: 0.35
      final_rotation: true
      allow_backward: false


# LOCAL COSTMAP
/blueboat/local_costmap/local_costmap:
  ros__parameters:

    use_sim_time: false

    global_frame: blueboat/map
    robot_base_frame: blueboat/base_link_enu

    # Frecuencias
    update_frequency: 5.0
    publish_frequency: 2.0

    # Mapa local alrededor del robot
    rolling_window: true

    width: 30
    height: 30
    resolution: 0.25

    # Dimensiones del BlueBoat
    robot_radius: 0.4

    track_unknown_space: true

    # Capas
    plugins:
      - static_layer
      - inflation_layer

    # Mapa 
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"

      map_topic: /blueboat/projected_map

      map_subscribe_transient_local: true

    # Margen alrededor de obstáculos
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"

      inflation_radius: 1.0
      cost_scaling_factor: 3.0

    always_send_full_costmap: true

/blueboat/nav2_velocity_adapter:
  ros__parameters:
    use_sim_time: false

    requester: "nav2"
    controller: "body_velocity"
    priority: 80
    frame_id: "blueboat/base_link"
